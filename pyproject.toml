[project]
name = "receipted"
version = "0.1.0"
description = "AI agent that checks receipt images against a claim, price list and policy"
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
